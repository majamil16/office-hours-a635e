<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Hours · Ops</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .ops { max-width: 920px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .ops h1 { font-size: 1.75rem; margin: 0 0 .35rem; }
    .ops-sub { color: var(--muted, #666); margin: 0 0 1.5rem; }
    .ops-login, .ops-card { border: 1px solid rgba(0,0,0,.12); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1rem; background: #fff; }
    .ops-card h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
    .ops-meta { font-family: ui-monospace, monospace; font-size: .82rem; white-space: pre-wrap; background: #f6f6f4; padding: .75rem; border-radius: 8px; margin: .5rem 0; }
    .ops-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
    .ops-actions .btn { cursor: pointer; }
    .ops-status { min-height: 1.25rem; color: #a33; }
    .ops-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .ops-badge { display: inline-block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; padding: .15rem .45rem; border-radius: 999px; background: #eee; }
    .ops-badge.is-submitted { background: #ffe8a3; }
    .ops-badge.is-accepted, .ops-badge.is-confirmed { background: #c8f0d4; }
    .ops-empty { color: var(--muted, #666); }
  </style>
</head>
<body>
  <main class="ops">
    <div class="ops-top">
      <div>
        <h1>Operator inbox</h1>
        <p class="ops-sub">Act as the Office Hours Jelly service account. Copy a DM, send it on Jelly, then update the order.</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/">← Site</a>
    </div>

    <section class="ops-login" id="login">
      <form id="tokenForm">
        <label>OPS_TOKEN
          <input name="token" type="password" autocomplete="current-password" required placeholder="Bearer token from env">
        </label>
        <button class="btn" type="submit">Unlock inbox</button>
        <p class="ops-status" id="loginStatus" role="status"></p>
      </form>
    </section>

    <section id="inbox" hidden>
      <div class="ops-top" style="margin-bottom:1rem">
        <p class="ops-sub" id="botLabel" style="margin:0"></p>
        <button class="btn btn-ghost btn-sm" type="button" id="refresh">Refresh</button>
      </div>
      <div id="list"></div>
      <p class="ops-empty" id="empty" hidden>No open orders.</p>
      <p class="ops-status" id="inboxStatus" role="status"></p>
    </section>
  </main>
  <script src="/ops.js"></script>
</body>
</html>
